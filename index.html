<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Chat</title>
    <script src='https://cdn.scaledrone.com/scaledrone.min.js'></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 400px; height: 100vh; background: white; display: flex; flex-direction: column; }
        .header { background: #0084ff; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 15px; max-width: 80%; font-size: 14px; }
        .mine { background: #0084ff; color: white; align-self: flex-end; }
        .theirs { background: #e4e6eb; color: black; align-self: flex-start; }
        .input-box { padding: 10px; display: flex; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ddd; outline: none; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header" id="header">Đang kết nối...</div>
    <div id="messages"></div>
    <div class="input-box">
        <input type="text" id="input" placeholder="Aa" onkeypress="if(event.key==='Enter') sendMessage()">
    </div>
</div>

<script>
    // Khóa kết nối công cộng
    const drone = new ScaleDrone('yiS12Ts5RdSrxp2p');
    const roomName = 'observable-facebook-room';
    let room;

    drone.on('open', error => {
        if (error) return console.error(error);
        document.getElementById('header').innerText = "Messenger (Đã trực tuyến)";
        room = drone.subscribe(roomName);
        room.on('data', (data, member) => {
            const isMine = member.id === drone.clientId;
            const div = document.createElement('div');
            div.className = 'msg ' + (isMine ? 'mine' : 'theirs');
            div.innerText = data;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = 10000;
        });
    });

    function sendMessage() {
        const input = document.getElementById('input');
        if (input.value) {
            drone.publish({ room: roomName, message: input.value });
            input.value = '';
        }
    }
</script>
</body>
</html>
