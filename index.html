<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Real-time (Admin Mode)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-card { width: 400px; height: 600px; background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #2c3e50; color: white; padding: 15px; text-align: center; position: relative; }
        #admin-badge { display: none; background: #e74c3c; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 5px; }
        #chat-window { flex: 1; overflow-y: auto; padding: 15px; background: #f9f9f9; display: flex; flex-direction: column; }
        .msg { margin-bottom: 10px; padding: 10px; border-radius: 10px; font-size: 14px; max-width: 80%; }
        .mine { background: #3498db; color: white; align-self: flex-end; }
        .theirs { background: #ecf0f1; color: #333; align-self: flex-start; }
        .footer { padding: 15px; background: white; border-top: 1px solid #eee; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 8px; outline: none; }
        .btn-row { display: flex; gap: 5px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-send { background: #2ecc71; color: white; }
        .btn-admin { background: #95a5a6; color: white; font-size: 12px; }
        .btn-clear { background: #e74c3c; color: white; display: none; margin-top: 5px; }
    </style>
</head>
<body>

<div class="chat-card">
    <div class="header">
        <strong>Phòng Chat Bảo Mật</strong> <span id="admin-badge">ADMIN</span>
        <small id="my-id-display" style="display:block; font-size:10px; opacity:0.7; margin-top:5px; cursor:pointer">Đang tạo ID...</small>
    </div>
    
    <div id="chat-window"></div>

    <div class="footer">
        <input type="text" id="peer-id-input" placeholder="Nhập ID đối phương...">
        <div class="btn-row">
            <button onclick="connectToPeer()" style="background:#34495e; color:white;">Kết nối</button>
            <button class="btn-admin" onclick="loginAdmin()">🔑 Admin</button>
        </div>
        <hr>
        <input type="text" id="message-input" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="btn-send" onclick="sendMessage()">GỬI TIN</button>
        <button id="clear-btn" class="btn-clear" onclick="clearChat()">XÓA TẤT CẢ (ADMIN)</button>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const messageInput = document.getElementById('message-input');
    const myIdDisplay = document.getElementById('my-id-display');
    const peerIdInput = document.getElementById('peer-id-input');
    const adminBadge = document.getElementById('admin-badge');
    const clearBtn = document.getElementById('clear-btn');

    // MẬT KHẨU ADMIN (Bạn có thể đổi ở đây)
    const ADMIN_PASSWORD = "123"; 

    let peer = new Peer();
    let conn;
    let isAdmin = false;

    // Lấy ID cá nhân
    peer.on('open', (id) => {
        myIdDisplay.innerText = "ID CỦA BẠN: " + id + " (Bấm để copy)";
        myIdDisplay.onclick = () => { navigator.clipboard.writeText(id); alert("Đã copy ID!"); };
    });

    // Chờ kết nối
    peer.on('connection', (c) => {
        conn = c;
        setupChat();
    });

    // Đăng nhập Admin
    function loginAdmin() {
        const pass = prompt("Nhập mật mã Admin:");
        if(pass === ADMIN_PASSWORD) {
            isAdmin = true;
            adminBadge.style.display = "inline-block";
            clearBtn.style.display = "block";
            alert("Đăng nhập Admin thành công!");
        } else {
            alert("Sai mật mã!");
        }
    }

    function connectToPeer() {
        const peerId = peerIdInput.value;
        if (peerId) {
            conn = peer.connect(peerId);
            setupChat();
        }
    }

    function setupChat() {
        conn.on('open', () => {
            appendMessage('Hệ thống', 'Đã kết nối!', 'theirs');
            conn.on('data', (data) => {
                appendMessage('Đối phương', data, 'theirs');
            });
        });
    }

    function sendMessage() {
        const msg = messageInput.value;
        if (msg && conn) {
            const prefix = isAdmin ? "[ADMIN]: " : "";
            conn.send(prefix + msg);
            appendMessage('Tôi', prefix + msg, 'mine');
            messageInput.value = '';
        }
    }

    function appendMessage(sender, text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function clearChat() {
        if(isAdmin) {
            chatWindow.innerHTML = '';
            appendMessage('Hệ thống', 'Admin đã dọn dẹp lịch sử chat.', 'theirs');
        }
    }
</script>

</body>
</html>
