<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Real-time Siêu Tốc</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #e5ddd5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 400px; height: 90vh; background: white; display: flex; flex-direction: column; shadow: 0 4px 15px rgba(0,0,0,0.2); border-radius: 10px; overflow: hidden; }
        .header { background: #075e54; color: white; padding: 15px; text-align: center; }
        #status { font-size: 12px; display: block; margin-top: 5px; color: #dcf8c6; }
        #chat-window { flex: 1; overflow-y: auto; padding: 15px; background: #efe7dd; display: flex; flex-direction: column; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 10px; max-width: 80%; font-size: 14px; line-height: 1.4; }
        .mine { background: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 0; }
        .theirs { background: white; align-self: flex-start; border-bottom-left-radius: 0; }
        .footer { padding: 10px; background: #f0f0f0; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: none; border-radius: 20px; outline: none; }
        button { background: #128c7e; color: white; border: none; padding: 10px 15px; border-radius: 50%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <strong>Phòng Chat Bí Mật</strong>
        <span id="status">Đang khởi tạo...</span>
    </div>
    <div id="chat-window"></div>
    <div class="footer">
        <input type="text" id="message-input" placeholder="Nhập tin nhắn..." disabled>
        <button id="send-btn" onclick="sendMessage()" disabled>➤</button>
    </div>
</div>

<script>
    const statusText = document.getElementById('status');
    const chatWindow = document.getElementById('chat-window');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    const peer = new Peer();
    let conn;

    // 1. Khi bạn mở trang web, lấy ID của mình và tạo link mời
    peer.on('open', (id) => {
        const inviteLink = window.location.origin + window.location.pathname + "?id=" + id;
        statusText.innerHTML = `ID của bạn: ${id} <br> <a href="#" onclick="copyLink('${inviteLink}')" style="color:white">Bấm để copy link mời bạn bè</a>`;
        
        // KIỂM TRA: Nếu URL có sẵn ?id=... thì tự động kết nối tới ID đó
        const urlParams = new URLSearchParams(window.location.search);
        const friendId = urlParams.get('id');
        if (friendId) {
            connectToFriend(friendId);
        }
    });

    function copyLink(link) {
        navigator.clipboard.writeText(link);
        alert("Đã copy link mời! Hãy gửi link này cho bạn bè.");
    }

    // 2. Chờ bạn bè kết nối tới mình
    peer.on('connection', (c) => {
        conn = c;
        startChat();
    });

    // 3. Hàm kết nối tới bạn bè
    function connectToFriend(friendId) {
        statusText.innerText = "Đang kết nối tới bạn bè...";
        conn = peer.connect(friendId);
        startChat();
    }

    function startChat() {
        conn.on('open', () => {
            statusText.innerText = "Đã kết nối! Bắt đầu chat thôi.";
            messageInput.disabled = false;
            sendBtn.disabled = false;
            
            conn.on('data', (data) => {
                appendMessage(data, 'theirs');
            });
        });
    }

    function sendMessage() {
        const msg = messageInput.value;
        if (msg && conn) {
            conn.send(msg);
            appendMessage(msg, 'mine');
            messageInput.value = '';
        }
    }

    function appendMessage(text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }
</script>

</body>
</html>
