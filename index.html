<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Messenger</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-app { width: 100%; max-width: 450px; height: 95vh; background: white; display: flex; flex-direction: column; box-shadow: 0 12px 28px rgba(0,0,0,0.12); border-radius: 10px; overflow: hidden; }
        .header { background: #fff; border-bottom: 1px solid #dbdbdb; padding: 15px; display: flex; align-items: center; gap: 10px; }
        .dot { width: 12px; height: 12px; background: #31a24c; border-radius: 50%; border: 2px solid white; }
        #chat-window { flex: 1; overflow-y: auto; padding: 15px; background: #fff; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 18px; font-size: 15px; max-width: 75%; word-wrap: break-word; line-height: 1.4; }
        .mine { background: #0084ff; color: white; align-self: flex-end; }
        .theirs { background: #e4e6eb; color: black; align-self: flex-start; }
        .footer { padding: 10px; border-top: 1px solid #ddd; display: flex; align-items: center; gap: 10px; }
        input { flex: 1; padding: 10px 15px; border-radius: 20px; border: none; background: #f0f2f5; outline: none; }
        button { background: none; border: none; color: #0084ff; font-weight: bold; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<div class="chat-app">
    <div class="header">
        <div class="dot"></div>
        <strong>Messenger - Nhóm Chat</strong>
    </div>
    <div id="chat-window"></div>
    <div class="footer">
        <input type="text" id="input" placeholder="Aa" onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">Gửi</button>
    </div>
</div>

<script>
    // Kết nối đến một server chat miễn phí công cộng (Cực dễ kết nối)
    const socket = io("https://socket-io-chat.now.sh");
    const chatWindow = document.getElementById('chat-window');

    // Lắng nghe tin nhắn mới từ server
    socket.on('new message', (data) => {
        appendMsg(data.message, false);
    });

    function send() {
        const input = document.getElementById('input');
        const message = input.value.trim();
        if (message) {
            // Gửi tin nhắn lên server
            socket.emit('new message', message);
            // Hiển thị tin nhắn của chính mình
            appendMsg(message, true);
            input.value = '';
        }
    }

    function appendMsg(text, isMine) {
        const div = document.createElement('div');
        div.className = 'msg ' + (isMine ? 'mine' : 'theirs');
        div.innerText = text;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // Thông báo khi đã kết nối thành công
    socket.on('connect', () => {
        const div = document.createElement('div');
        div.style = "text-align:center; font-size:12px; color:gray; margin:10px;";
        div.innerText = "Hệ thống: Đã kết nối trực tuyến!";
        chatWindow.appendChild(div);
    });
</script>
</body>
</html>
