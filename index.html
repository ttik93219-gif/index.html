<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chat Đơn Giản</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #log { height: 300px; border: 1px solid #ccc; overflow-y: scroll; margin-bottom: 10px; padding: 10px; background: #f9f9f9; }
        input { width: 80%; padding: 10px; }
        button { padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h3>Phòng Chat Thử Nghiệm</h3>
    <div id="log"></div>
    <input type="text" id="msg" placeholder="Nhập gì đó rồi nhấn Gửi...">
    <button onclick="send()">Gửi</button>

    <script>
        // Tự động thông báo nếu code chạy được
        const log = document.getElementById('log');
        log.innerHTML += "<div>> Hệ thống đang sẵn sàng...</div>";

        function send() {
            const val = document.getElementById('msg').value;
            if(val) {
                const div = document.createElement('div');
                div.innerText = "Bạn: " + val;
                log.appendChild(div);
                document.getElementById('msg').value = '';
                // Lưu ý: Đây là bản test giao diện, để nhắn tin real-time 
                // cần kết nối mạng ổn định với PubNub ở code trên.
            }
        }
    </script>
</body>
</html>
