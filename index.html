<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Chat Công Cộng</title>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #ece5dd; margin: 0; display: flex; justify-content: center; }
        .chat-box { width: 100%; max-width: 400px; height: 100vh; background: white; display: flex; flex-direction: column; }
        .header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; }
        .msg { margin: 5px; padding: 10px; border-radius: 10px; max-width: 80%; font-size: 14px; }
        .others { background: #f1f0f0; align-self: flex-start; }
        .me { background: #dcf8c6; align-self: flex-end; }
        .footer { padding: 10px; border-top: 1px solid #ddd; display: flex; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { background: #075e54; color: white; border: none; padding: 10px 15px; margin-left: 5px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-box">
    <div class="header">NHÓM CHAT CHUNG</div>
    <div id="messages"></div>
    <div class="footer">
        <input type="text" id="input" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()">➤</button>
    </div>
</div>

<script>
    // Tạo một ID ngẫu nhiên cho bạn để phân biệt tin nhắn của mình và người khác
    const myID = 'User_' + Math.floor(Math.random() * 1000);
    
    // Khởi tạo hệ thống kết nối (Dùng key miễn phí có sẵn)
    const pubnub = new PubNub({
        publishKey: 'pub-c-69f82631-6b4d-48d6-99c5-6531853d463e',
        subscribeKey: 'sub-c-529dfa86-7780-496a-b2f5-21d3f9e9df37',
        userId: myID
    });

    // Lắng nghe tin nhắn mới
    pubnub.addListener({
        message: (obj) => {
            const div = document.createElement('div');
            div.className = 'msg ' + (obj.publisher === myID ? 'me' : 'others');
            div.innerText = (obj.publisher === myID ? '' : obj.publisher + ': ') + obj.message;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }
    });

    // Tham gia vào phòng chat có tên là "phong-chung"
    pubnub.subscribe({ channels: ['phong-chung'] });

    // Hàm gửi tin nhắn
    function send() {
        const input = document.getElementById('input');
        if (input.value) {
            pubnub.publish({ channel: ['phong-chung'], message: input.value });
            input.value = '';
        }
    }
</script>

</body>
</html>
